name: Alpha.3 test.39 release

on:
  push:
    branches:
      - feature/alpha3-material-preview
    paths:
      - ".github/workflows/alpha3-test39-release.yml"

permissions:
  contents: write

concurrency:
  group: alpha3-test39-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    env:
      SOURCE_SHA: a58a91a24272415c3f4c3322610ea3976710c354
      VERSION: 0.1.0-alpha.3-test.39
      TAG: v0.1.0-alpha.3-test.39

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        shell: pwsh
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Build UI
        shell: pwsh
        working-directory: src/MapStudio.UI
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build desktop host
        shell: pwsh
        run: dotnet build src/MapStudio.Desktop/MapStudio.Desktop.csproj --configuration Release -p:EnableWindowsTargeting=true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -Version $env:VERSION -SkipUiBuild -SkipLaunchSmokeTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-$env:TAG-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path -Leaf $zipPath)" | Set-Content "$zipPath.sha256" -Encoding ascii

          $installerPath = "artifacts/OMSI-Map-Studio-Setup-$env:VERSION-win-x64.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found: $installerPath"
          }

          if (-not (Test-Path "$installerPath.sha256")) {
            $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$installerHash  $(Split-Path -Leaf $installerPath)" | Set-Content "$installerPath.sha256" -Encoding ascii
          }

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # OMSI Map Studio v0.1.0-alpha.3-test.39

          Build de teste / Test build

          Source HEAD: $env:SOURCE_SHA

          PT-BR:
          - UI/UX do editor reorganizada para um fluxo mais próximo de city-builders modernos.
          - Construção concentrada em HUD/dock inferior com categorias grandes e contexto de ferramenta.
          - Explorador e inspetor funcionam como drawers laterais, liberando mais área para o mapa.
          - Desktop e tela cheia usam a mesma lógica visual, reduzindo mudanças de comportamento entre modos.
          - Menus e botões antigos redundantes foram removidos/ocultados da superfície principal.
          - Seleção por clique no mapa foi reforçada para objetos e splines reais.
          - Picking considera meshes filhos/instâncias e mantém identidade do item OMSI selecionado.
          - Hover/feedback visual ajuda a identificar o item clicável antes da seleção.
          - Mantém todas as funções de construção, biblioteca, saúde do mapa, conjuntos e backups da test.38.
          - PR #2 continua draft e sem merge.

          EN:
          - Editor UI/UX reorganized around a modern city-builder workflow.
          - Construction is concentrated in a bottom HUD/dock with large categories and contextual tools.
          - Explorer and inspector work as side drawers, leaving more room for the map.
          - Desktop and full-screen now share the same visual interaction model.
          - Redundant legacy menu/buttons are removed or hidden from the main surface.
          - Map click selection is reinforced for real OMSI objects and splines.
          - Picking resolves child meshes/instances while preserving the real OMSI item identity.
          - Hover/visual feedback helps identify selectable items before clicking.
          - All test.38 construction, library, map health, construction-set, and backup features remain available.
          - PR #2 remains draft and is not merged.
          "@ | Set-Content "artifacts/release-notes-test39.md" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.39-win-x64
          path: |
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.39-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.39-win-x64.zip.sha256
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.39-win-x64.exe
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.39-win-x64.exe.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/OMSI-Map-Studio-$env:TAG-win-x64.zip"
          $zipHash = "$zip.sha256"
          $installer = "artifacts/OMSI-Map-Studio-Setup-$env:VERSION-win-x64.exe"
          $installerHash = "$installer.sha256"

          gh release view $env:TAG --repo "MichaelPriest/OMSI-Map-Studio" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip $zipHash $installer $installerHash --repo "MichaelPriest/OMSI-Map-Studio" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            gh release create $env:TAG $zip $zipHash $installer $installerHash `
              --repo "MichaelPriest/OMSI-Map-Studio" `
              --target $env:SOURCE_SHA `
              --title "OMSI Map Studio $env:TAG" `
              --notes-file "artifacts/release-notes-test39.md" `
              --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
