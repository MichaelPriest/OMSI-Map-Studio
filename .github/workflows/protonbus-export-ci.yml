name: Proton Bus Export CI

on:
  push:
    branches:
      - feature/protonbus-map-export
    paths:
      - "src/MapStudio.Core/ProtonBus/**"
      - "src/MapStudio.Core/MapStudio.Core.csproj"
      - "src/MapStudio.Native/**"
      - "tests/MapStudio.ProtonBus.Tests/**"
      - "docs/pt-BR/PROTON_BUS_EXPORT.md"
      - "docs/en/PROTON_BUS_EXPORT.md"
      - ".github/workflows/protonbus-export-ci.yml"
  pull_request:
    paths:
      - "src/MapStudio.Core/ProtonBus/**"
      - "src/MapStudio.Core/MapStudio.Core.csproj"
      - "src/MapStudio.Native/**"
      - "tests/MapStudio.ProtonBus.Tests/**"
      - ".github/workflows/protonbus-export-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protonbus-export-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-protonbus-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test Proton Bus export core
        run: dotnet test tests/MapStudio.ProtonBus.Tests/MapStudio.ProtonBus.Tests.csproj --configuration Release --arch x64


  validate-native-export-ui:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build native WinUI host
        run: dotnet build src/MapStudio.Native/MapStudio.Native.csproj --configuration Release -p:Platform=x64
