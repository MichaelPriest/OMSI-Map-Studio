name: Proton Bus Export CI

on:
  push:
    branches:
      - feature/protonbus-map-export
    paths:
      - "src/MapStudio.Core/ProtonBus/**"
      - "tests/MapStudio.Core.Tests/ProtonBus*"
      - "docs/pt-BR/PROTON_BUS_EXPORT.md"
      - "docs/en/PROTON_BUS_EXPORT.md"
      - ".github/workflows/protonbus-export-ci.yml"
  pull_request:
    paths:
      - "src/MapStudio.Core/ProtonBus/**"
      - "tests/MapStudio.Core.Tests/ProtonBus*"
      - ".github/workflows/protonbus-export-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protonbus-export-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-protonbus-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test MapStudio.Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release --arch x64
