name: alpha3 test1 prerelease

on:
  push:
    branches:
      - publish/alpha3-test1

permissions:
  contents: write

concurrency:
  group: alpha3-test1-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 6483e223cc2e5e482512ed4274b2d0406cb5510a
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "6483e223cc2e5e482512ed4274b2d0406cb5510a"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Publish Windows x64 self-contained
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64"
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

          dotnet publish src/MapStudio.Desktop/MapStudio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDir -p:EnableWindowsTargeting=true -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=0.1.0-alpha.3-test.1 -p:InformationalVersion=0.1.0-alpha.3-test.1+6483e223cc2e5e482512ed4274b2d0406cb5510a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $publishDir "OMSI Map Studio.exe"
          $uiIndex = Join-Path $publishDir "ui/index.html"
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }
          if (-not (Test-Path $uiIndex)) { throw "React UI was not embedded in publish output: $uiIndex" }

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip" | Set-Content "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip.sha256" -Encoding ascii
          $pt = Get-Content "docs/pt-BR/releases/v0.1.0-alpha.3.md" -Raw
          $en = Get-Content "docs/en/releases/v0.1.0-alpha.3.md" -Raw
          $notes = "# OMSI Map Studio v0.1.0-alpha.3-test.1`r`n`r`nBuild de teste / Test build`r`n`r`nSource HEAD: 6483e223cc2e5e482512ed4274b2d0406cb5510a`r`n`r`nEsta prerelease foi gerada somente após testes Core, build React e publish Windows x64 self-contained passarem.`r`n`r`nThis prerelease was generated only after Core tests, React build and Windows x64 self-contained publish passed.`r`n`r`n---`r`n`r`n$pt`r`n`r`n---`r`n`r`n$en"
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64
          path: |
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.1"
          $sourceHead = "6483e223cc2e5e482512ed4274b2d0406cb5510a"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.1-win-x64.zip"
          $shaPath = "$zipPath.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }
          gh release create $tag $zipPath $shaPath --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
