name: Native Windows CI

on:
  pull_request:
    branches:
      - feature/alpha3-material-preview
      - main
    paths:
      - "src/MapStudio.Core/**"
      - "src/MapStudio.Native/**"
      - "src/MapStudio.Renderer/**"
      - "tests/MapStudio.Core.Tests/**"
      - "tests/MapStudio.Renderer.Tests/**"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x


      - name: Verify manual tools accessibility and persistence wiring
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $window = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw

          $visibleRoutes = @(
            @{ Pattern = '<Button[\s\S]*?Content="Validar mapa"[\s\S]*?Click="OnToolValidationClick"\s*/>'; Name = 'Selection -> Validate' },
            @{ Pattern = '<Button[\s\S]*?Content="Infraestrutura"[\s\S]*?Click="OnToolUtilitiesClick"\s*/>'; Name = 'Objects -> Utilities' },
            @{ Pattern = '<MenuFlyoutItem[\s\S]*?Text="Criador de túnel"[\s\S]*?Click="OnCreateTunnelClick"\s*/>'; Name = 'Roads -> Tunnel creator' },
            @{ Pattern = '<Button[\s\S]*?Content="Paradas e terminais"[\s\S]*?Click="OnToolTransitAssetsClick"\s*/>'; Name = 'Transport -> Transit assets' }
          )

          foreach ($route in $visibleRoutes) {
            if ($xaml -notmatch $route.Pattern) {
              throw "visible manual route is missing: $($route.Name)"
            }
          }

          $moduleRail = [regex]::Match(
            $xaml,
            '<Border\s+x:Name="EditorModuleRail"[\s\S]*?</Border>')
          if (-not $moduleRail.Success -or $moduleRail.Value.Contains('Visibility="Collapsed"')) {
            throw "Editor module rail must remain visible."
          }

          foreach ($required in @(
            'OnCreateTunnelClick',
            'OnToolTransitAssetsClick',
            'OnToolUtilitiesClick',
            'OnToolValidationClick',
            'OnEditTrackClick',
            'OnEditTrafficProgramClick',
            'TryFinishSceneryPlacementAtWorldPoint',
            'HandleSceneryPlacementAsync'
          )) {
            if (-not $window.Contains($required)) {
              throw "Manual tool workflow marker is missing: $required"
            }
          }

          foreach ($required in @(
            'InsertSceneryObjectAsync',
            'InsertSplineAsync',
            'UpdateTimetableTrackAsync',
            'UpdateStationLinkAsync',
            'UpdateTrafficLightProgramAsync',
            'SafeFileTransaction',
            'OmsiTimetableTrackReader',
            'OmsiStationLinkReader',
            'OmsiSceneryObjectReader'
          )) {
            if (-not $session.Contains($required)) {
              throw "Manual persistence/reload marker is missing: $required"
            }
          }

      - name: Test OMSI core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release --arch x64

      - name: Test renderer core
        run: dotnet test tests/MapStudio.Renderer.Tests/MapStudio.Renderer.Tests.csproj --configuration Release --arch x64

      - name: Build native WinUI host
        run: dotnet build src/MapStudio.Native/MapStudio.Native.csproj --configuration Release -p:Platform=x64
