name: alpha3 test9 prerelease

on:
  push:
    branches:
      - publish/alpha3-test9

permissions:
  contents: write

concurrency:
  group: alpha3-test9-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: b8c2f1035bc32884b71eb5bc3121d3ab1853ebb4
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "b8c2f1035bc32884b71eb5bc3121d3ab1853ebb4"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Publish Windows x64 self-contained
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64"
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

          dotnet publish src/MapStudio.Desktop/MapStudio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDir -p:EnableWindowsTargeting=true -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=0.1.0-alpha.3-test.9 -p:InformationalVersion=0.1.0-alpha.3-test.9+b8c2f1035bc32884b71eb5bc3121d3ab1853ebb4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $publishDir "OMSI Map Studio.exe"
          $uiIndex = Join-Path $publishDir "ui/index.html"
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }
          if (-not (Test-Path $uiIndex)) { throw "React UI was not embedded in publish output: $uiIndex" }

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip" | Set-Content "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip.sha256" -Encoding ascii
          $notes = @"
          # OMSI Map Studio v0.1.0-alpha.3-test.9

          Build de teste / Test build

          Source HEAD: b8c2f1035bc32884b71eb5bc3121d3ab1853ebb4

          Esta prerelease corrige a apresentação da textura base do terreno: BMP/PNG/JPEG/GIF/WebP usam o caminho de decodificação do WebView/Chromium, DDS/TGA mantêm loaders dedicados, a camada 0 é opaca e o terreno é exibido como albedo sem escurecimento artificial pela luz do editor. O blend da textura de detalhe continua deliberadamente não simulado.

          This prerelease fixes base-terrain texture presentation: BMP/PNG/JPEG/GIF/WebP use the WebView/Chromium decode path, DDS/TGA keep dedicated loaders, layer 0 is opaque, and terrain is displayed as albedo without artificial editor-light darkening. Detail-texture blending remains deliberately unsimulated.
          "@
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64
          path: |
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.9"
          $sourceHead = "b8c2f1035bc32884b71eb5bc3121d3ab1853ebb4"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.9-win-x64.zip"
          $shaPath = "$zipPath.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }
          gh release create $tag $zipPath $shaPath --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
