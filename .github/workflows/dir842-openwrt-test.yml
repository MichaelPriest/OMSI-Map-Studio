name: DIR842 OpenWrt Test Build

on:
  push:
    branches:
      - ci/dir842-openwrt-test-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Clone pinned DIR-842 port
        shell: bash
        run: |
          set -eux
          git clone https://github.com/ADCDS/openwrt-dlink-dir842-r1.git dir842-port
          cd dir842-port
          git checkout 229536d89c25a676417717304fcef386a53a7875
          test "$(git rev-parse HEAD)" = "229536d89c25a676417717304fcef386a53a7875"

      - name: Apply staged fixes
        shell: bash
        run: |
          set -eux
          cd dir842-port

          install -D -m 0644             "$GITHUB_WORKSPACE/.ci/dir842/07-rtw88-blank-efuse-user-regdomain.patch"             files/package/kernel/mac80211/patches/realtek/07-rtw88-blank-efuse-user-regdomain.patch

          for p in             08-dir842-bridge-role-reset.patch             09-dir842-explicit-radio0-reset.patch
          do
            git apply --recount --check "$GITHUB_WORKSPACE/.ci/dir842/$p"
            git apply --recount "$GITHUB_WORKSPACE/.ci/dir842/$p"
          done

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {n}")
              p.write_text(s.replace(old, new, 1))
              print(f"applied: {label}")

          eth = "files/target/linux/realtek/files-4.14/drivers/net/ethernet/rtl819x/rtl819x-eth.c"
          asic = "files/target/linux/realtek/base-files/etc/init.d/dir842-asic"

          replace_once(
              eth,
              'FABRIC WEDGE detected (large-frame FCS fail=%u ok=%u in 10s)%s',
              'FABRIC WEDGE detected (large-frame FCS fail=%u ok=%u in ~2.5s)%s',
              "FCS detector window text",
          )
          replace_once(
              eth,
              '" - set fabric_reset=2 to recover"',
              '" - set fabric_reset=3 to recover"',
              "RX stall recovery guidance",
          )
          replace_once(
              eth,
              'static int fabric_gw_rearm = 1;\n'
              'module_param(fabric_gw_rearm, int, 0644);\n'
              'MODULE_PARM_DESC(fabric_gw_rearm, "level-3 recovery re-arms the ASIC gw program (default 1; set 0 in bridge role)");\n',
              'static int fabric_gw_rearm = 1;\n'
              'module_param(fabric_gw_rearm, int, 0644);\n'
              'MODULE_PARM_DESC(fabric_gw_rearm, "level-3 recovery re-arms the ASIC gw program (default 1; set 0 in bridge role)");\n\n'
              'static int fabric_hwnat_rearm = 1;\n'
              'module_param(fabric_hwnat_rearm, int, 0644);\n'
              'MODULE_PARM_DESC(fabric_hwnat_rearm,\n'
              '\t\t "level-3 recovery re-arms hardware NAT (default 1; set 0 in bridge role)");\n',
              "HW NAT recovery gate parameter",
          )
          replace_once(
              eth,
              '\tif (mode >= 3) {\n'
              '\t\trtl819x_hwnat_start(priv->dev);\n'
              '\t\t/*\n'
              '\t\t * M7 self-heal:',
              '\tif (mode >= 3) {\n'
              '\t\tif (fabric_hwnat_rearm) {\n'
              '\t\t\trtl819x_hwnat_start(priv->dev);\n'
              '\t\t} else {\n'
              '\t\t\tpr_err("rtl819x: HW NAT re-arm SKIPPED (fabric_hwnat_rearm=0, bridge role)\\n");\n'
              '\t\t}\n\n'
              '\t\t/*\n'
              '\t\t * M7 self-heal:',
              "gate HW NAT re-arm in level-3 recovery",
          )
          replace_once(
              asic,
              '\tif [ "$ROLE" = "bridge" ]; then\n'
              '\t\techo 3 > /sys/module/rtl819x/parameters/fabric_autoreset 2>/dev/null\n'
              '\t\techo 0 > /sys/module/rtl819x/parameters/fabric_gw_rearm 2>/dev/null\n'
              '\telse\n'
              '\t\techo 3 > /sys/module/rtl819x/parameters/fabric_autoreset 2>/dev/null\n'
              '\t\techo 1 > /sys/module/rtl819x/parameters/fabric_gw_rearm 2>/dev/null\n'
              '\tfi',
              '\tif [ "$ROLE" = "bridge" ]; then\n'
              '\t\techo 3 > /sys/module/rtl819x/parameters/fabric_autoreset 2>/dev/null\n'
              '\t\techo 0 > /sys/module/rtl819x/parameters/fabric_hwnat_rearm 2>/dev/null\n'
              '\t\techo 0 > /sys/module/rtl819x/parameters/fabric_gw_rearm 2>/dev/null\n'
              '\telse\n'
              '\t\techo 3 > /sys/module/rtl819x/parameters/fabric_autoreset 2>/dev/null\n'
              '\t\techo 1 > /sys/module/rtl819x/parameters/fabric_hwnat_rearm 2>/dev/null\n'
              '\t\techo 1 > /sys/module/rtl819x/parameters/fabric_gw_rearm 2>/dev/null\n'
              '\tfi',
              "set role-specific HW NAT recovery gate",
          )
          replace_once(
              asic,
              '\tif [ "$ROLE" = "router" ]; then\n'
              '\t\techo 1 > /sys/module/rtl819x/parameters/hwnat 2>/dev/null\n'
              '\tfi\n'
              '\tlogger -t dir842-asic',
              '\tif [ "$ROLE" = "router" ]; then\n'
              '\t\techo 1 > /sys/module/rtl819x/parameters/hwnat 2>/dev/null\n'
              '\telse\n'
              '\t\t# Explicit/idempotent: bridge role must never retain NAT offload.\n'
              '\t\techo 0 > /sys/module/rtl819x/parameters/hwnat 2>/dev/null\n'
              '\tfi\n'
              '\tlogger -t dir842-asic',
              "force HW NAT off in bridge role",
          )
          PY

          git diff --check
          git status --short
          git diff --stat

      - name: Build DIR-842 OpenWrt images
        shell: bash
        run: |
          set -euxo pipefail
          cd dir842-port

          # Bullseye is archived now; keep the old userspace/toolchain generation
          # required by this 2020 OpenWrt tree, but source packages from the archive.
          cat > Dockerfile.ci <<'EOF'
          FROM debian:bullseye

          RUN printf '%s\\n' \
                'deb [check-valid-until=no] http://archive.debian.org/debian bullseye main' \
                'deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main' \
                > /etc/apt/sources.list && \
              rm -f /etc/apt/sources.list.d/*

          RUN apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=5 update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file \
                wget curl subversion swig time xsltproc libelf-dev bc python3 python2 \
                python-is-python2 ca-certificates ccache quilt && \
              rm -rf /var/lib/apt/lists/*

          ARG U=1000
          ARG G=1000
          RUN groupadd -g "$G" builder 2>/dev/null || true; \
              useradd -u "$U" -g "$G" -m -s /bin/bash builder
          USER builder
          ENV HOME=/home/builder FORCE_UNSAFE_CONFIGURE=1
          WORKDIR /build
          EOF

          docker build -f Dockerfile.ci             --build-arg U="$(id -u)"             --build-arg G="$(id -g)"             -t owrt-dir842-test .
          docker run --rm             -v "$PWD":/build             -w /build             owrt-dir842-test             ./build.sh 2>&1 | tee build.log

      - name: Collect images and checksums
        if: always()
        shell: bash
        run: |
          set -eux
          mkdir -p artifacts
          if [ -d dir842-port/openwrt/bin/targets/realtek/rtl8197f ]; then
            find dir842-port/openwrt/bin/targets/realtek/rtl8197f -maxdepth 1 -type f               \( -name '*.bin' -o -name '*.manifest' -o -name '*.buildinfo' -o -name 'sha256sums' \)               -exec cp -v {} artifacts/ \;
          fi
          cp -v dir842-port/build.log artifacts/build.log 2>/dev/null || true
          {
            echo "DIR-842 R1 OpenWrt test build"
            echo "Base: ADCDS/openwrt-dlink-dir842-r1"
            echo "Base commit: 229536d89c25a676417717304fcef386a53a7875 (v1.4.1)"
            echo "Staged fixes: 07..11"
            echo
            echo "SAFETY:"
            echo "- initramfs-kernel.bin: RAM test image; does not write flash by itself."
            echo "- squashfs-factory.bin / squashfs-sysupgrade.bin: FLASH images; use only after RAM test passes."
            echo "- Keep a full 8 MB NOR backup and serial recovery available."
          } > artifacts/BUILD-NOTES.txt
          (cd artifacts && sha256sum * > SHA256SUMS-test.txt)
          ls -lah artifacts

      - name: Upload DIR-842 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dir842-openwrt-v1.4.1-test-20261003
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
