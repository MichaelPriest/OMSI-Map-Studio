name: Alpha.3 test.38 release

on:
  push:
    branches:
      - feature/alpha3-material-preview
    paths:
      - ".github/workflows/alpha3-test38-release.yml"

permissions:
  contents: write

concurrency:
  group: alpha3-test38-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    env:
      SOURCE_SHA: 843aa3f4f00f27347eb30911c2373825d3f277ff
      VERSION: 0.1.0-alpha.3-test.38
      TAG: v0.1.0-alpha.3-test.38

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        shell: pwsh
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Build UI
        shell: pwsh
        working-directory: src/MapStudio.UI
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build desktop host
        shell: pwsh
        run: dotnet build src/MapStudio.Desktop/MapStudio.Desktop.csproj --configuration Release -p:EnableWindowsTargeting=true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -Version $env:VERSION -SkipUiBuild -SkipLaunchSmokeTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-$env:TAG-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path -Leaf $zipPath)" | Set-Content "$zipPath.sha256" -Encoding ascii

          $installerPath = "artifacts/OMSI-Map-Studio-Setup-$env:VERSION-win-x64.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found: $installerPath"
          }

          if (-not (Test-Path "$installerPath.sha256")) {
            $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$installerHash  $(Split-Path -Leaf $installerPath)" | Set-Content "$installerPath.sha256" -Encoding ascii
          }

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # OMSI Map Studio v0.1.0-alpha.3-test.38

          Build de teste / Test build

          Source HEAD: $env:SOURCE_SHA

          PT-BR:
          - Novo fluxo de construção inspirado em city-builders, sempre usando assets reais do OMSI.
          - Biblioteca por grupos/subgrupos, busca inteligente, favoritos, recentes, coleções e miniaturas 3D.
          - Criador de ruas com curva e alças de início/fim, snap de pontas e vínculo previous/next seguro.
          - Ponte/elevado, assistente de cruzamentos, lotes, arborização, postes e conjuntos compostos.
          - Inserção multi-lote transacional com IDs únicos e backup.
          - Auditoria e reparo preservativo de dependências .sco/.sli ausentes.
          - Painel Saúde do mapa e filtro de assets com problemas confirmados.
          - Diagnóstico técnico de O3D, meshes, materiais, texturas, perfis e colisões.
          - Ferramentas móveis agora preservam posição.
          - Mantém a PR #2 em draft, sem merge.

          EN:
          - New city-builder-inspired construction workflow using real OMSI assets only.
          - Grouped/subgrouped library, smart search, favorites, recent items, collections, and 3D thumbnails.
          - Road builder with curvature and draggable start/end handles, endpoint snapping, and safe previous/next linking.
          - Bridge/elevated workflow, junction assistant, lots, vegetation, street lights, and composite construction sets.
          - Transactional multi-asset batch insertion with unique IDs and backups.
          - Preservation-safe audit and repair of missing .sco/.sli dependencies.
          - Map Health dashboard and confirmed-problem asset filters.
          - Technical diagnostics for O3D, meshes, materials, textures, profiles, and collisions.
          - Movable tools now preserve their positions.
          - PR #2 remains draft and is not merged.
          "@ | Set-Content "artifacts/release-notes-test38.md" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.38-win-x64
          path: |
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.38-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.38-win-x64.zip.sha256
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.38-win-x64.exe
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.38-win-x64.exe.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/OMSI-Map-Studio-$env:TAG-win-x64.zip"
          $zipHash = "$zip.sha256"
          $installer = "artifacts/OMSI-Map-Studio-Setup-$env:VERSION-win-x64.exe"
          $installerHash = "$installer.sha256"

          gh release view $env:TAG --repo "MichaelPriest/OMSI-Map-Studio" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip $zipHash $installer $installerHash --repo "MichaelPriest/OMSI-Map-Studio" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            gh release create $env:TAG $zip $zipHash $installer $installerHash `
              --repo "MichaelPriest/OMSI-Map-Studio" `
              --target $env:SOURCE_SHA `
              --title "OMSI Map Studio $env:TAG" `
              --notes-file "artifacts/release-notes-test38.md" `
              --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
