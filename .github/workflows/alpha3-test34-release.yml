name: alpha3 test34 prerelease with EXE

on:
  push:
    branches:
      - publish/alpha3-test34

permissions:
  contents: write

concurrency:
  group: alpha3-test34-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 29b2b5224c651a94020031d6dfa6d74a647d002a
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "29b2b5224c651a94020031d6dfa6d74a647d002a"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows EXE installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "0.1.0-alpha.3-test.34" -SkipUiBuild

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.34-win-x64.zip"
          if (-not (Test-Path "$publishDir/OMSI Map Studio.exe")) { throw "Desktop EXE missing." }
          if (-not (Test-Path "$publishDir/ui/index.html")) { throw "React UI missing." }
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  OMSI-Map-Studio-v0.1.0-alpha.3-test.34-win-x64.zip" | Set-Content "$zipPath.sha256" -Encoding ascii

          $installerPath = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.34-win-x64.exe"
          $installerHashPath = "$installerPath.sha256"
          if (-not (Test-Path $installerPath)) { throw "Installer EXE missing: $installerPath" }
          if (-not (Test-Path $installerHashPath)) { throw "Installer checksum missing: $installerHashPath" }

          $notes = @"
          # OMSI Map Studio v0.1.0-alpha.3-test.34

          Build de teste / Test build

          Source HEAD: 29b2b5224c651a94020031d6dfa6d74a647d002a

          PT-BR:
          - Corrige o caminho visual das superfícies SLI/ruas para usar o albedo real diretamente, sem depender de emissive e sem novos offsets arbitrários.
          - Cruzamentos O3D horizontais texturizados mantêm o render lift existente e ignoram somente a iluminação do editor para evitar preto causado por normais de pacote.
          - O céu himmel01/himmel04/himmel05 passa pelo caminho BMP -> PNG validado no WebView2; terreno BMP permanece em RGBA bruto.
          - Clique real em mesh não é mais apagado no pointerup; segundo clique rápido continua focando o item.
          - O viewport mostra diagnóstico real de objeto/spline, mesh/material, textura resolvida, UV, posição final, render lift e origem SCO/SLI/O3D.
          - CI #371 passou antes desta publicação com 117/117 testes Core, UI e Desktop.

          EN:
          - Fixes the SLI/road visual path to use the real albedo directly, without relying on emissive rendering and without new arbitrary offsets.
          - Textured horizontal O3D junction meshes keep the existing render lift and only bypass editor lighting to prevent black output caused by pack normals.
          - himmel01/himmel04/himmel05 sky assets use the WebView2-validated BMP -> PNG path; terrain BMP stays on raw RGBA.
          - A real mesh click is no longer cleared on pointerup; a second quick click still focuses the item.
          - The viewport shows real object/spline, mesh/material, resolved texture, UV, final position, render lift, and SCO/SLI/O3D origin diagnostics.
          - CI #371 passed before this publication with 117/117 Core tests, UI, and Desktop.
          "@
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload EXE and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.34-windows
          path: |
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.34-win-x64.exe
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.34-win-x64.exe.sha256
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.34-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.34-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.34"
          $sourceHead = "29b2b5224c651a94020031d6dfa6d74a647d002a"
          $installer = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.34-win-x64.exe"
          $installerSha = "$installer.sha256"
          $zip = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.34-win-x64.zip"
          $zipSha = "$zip.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }

          gh release create $tag $installer $installerSha $zip $zipSha --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
