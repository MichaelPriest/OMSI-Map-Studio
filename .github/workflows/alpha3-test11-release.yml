name: alpha3 test11 prerelease with EXE

on:
  push:
    branches:
      - publish/alpha3-test11

permissions:
  contents: write

concurrency:
  group: alpha3-test11-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 644c4cab55ec15ff49f1600444aad30d85eccb93
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "644c4cab55ec15ff49f1600444aad30d85eccb93"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows EXE installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "0.1.0-alpha.3-test.11" -SkipUiBuild

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.11-win-x64.zip"
          if (-not (Test-Path "$publishDir/OMSI Map Studio.exe")) { throw "Desktop EXE missing." }
          if (-not (Test-Path "$publishDir/ui/index.html")) { throw "React UI missing." }
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  OMSI-Map-Studio-v0.1.0-alpha.3-test.11-win-x64.zip" | Set-Content "$zipPath.sha256" -Encoding ascii

          $installerPath = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.11-win-x64.exe"
          $installerHashPath = "$installerPath.sha256"
          if (-not (Test-Path $installerPath)) { throw "Installer EXE missing: $installerPath" }
          if (-not (Test-Path $installerHashPath)) { throw "Installer checksum missing: $installerHashPath" }

          $notes = @"
          # OMSI Map Studio v0.1.0-alpha.3-test.11

          Build de teste / Test build

          Source HEAD: 644c4cab55ec15ff49f1600444aad30d85eccb93

          Esta e a primeira prerelease que publica o OMSI Map Studio tambem como instalador Windows EXE. O instalador e por usuario, cria entrada no menu Iniciar, oferece atalho opcional na area de trabalho e instala a build self-contained com a UI React/WebView2 preservada. O ZIP portatil continua disponivel.

          This is the first prerelease that also publishes OMSI Map Studio as a Windows EXE installer. The per-user installer creates a Start Menu entry, offers an optional desktop shortcut, and installs the self-contained build while preserving the React/WebView2 UI files. The portable ZIP remains available.
          "@
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload EXE and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.11-windows
          path: |
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.11-win-x64.exe
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.11-win-x64.exe.sha256
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.11-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.11-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.11"
          $sourceHead = "644c4cab55ec15ff49f1600444aad30d85eccb93"
          $installer = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.11-win-x64.exe"
          $installerSha = "$installer.sha256"
          $zip = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.11-win-x64.zip"
          $zipSha = "$zip.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }

          gh release create $tag $installer $installerSha $zip $zipSha --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
