name: Native Preview Release
# Test 10.27: terrain-clipped CARTO ground-reference mosaic.

on:
  push:
    branches:
      - feature/native-winui-d3d11
    paths:
      - ".github/workflows/native-preview-release.yml"
      - "installer/MapStudio.NativePreview.iss"
      - "src/MapStudio.Native/App.xaml"
      - "src/MapStudio.Native/App.xaml.cs"
      - "src/MapStudio.Native/MainWindow.xaml"
      - "src/MapStudio.Native/MainWindow.xaml.cs"
      - "src/MapStudio.Native/Controls/NativeViewport.xaml.cs"
      - "src/MapStudio.Native/Services/NativeMapCredentialStore.cs"
      - "src/MapStudio.Native/Services/OmsiNativeSession.cs"
      - "src/MapStudio.Renderer/Graphics/D3D11NativeMapRenderer.cs"
      - "src/MapStudio.Renderer/Graphics/NativeGpuTextureLoader.cs"
      - "src/MapStudio.Renderer/Graphics/NativePngDecoder.cs"
      - "tests/MapStudio.Renderer.Tests/NativePngDecoderTests.cs"
      - "src/MapStudio.Renderer/Graphics/NativeTextureRetentionPlanner.cs"
      - "tests/MapStudio.Renderer.Tests/NativeTextureRetentionPlannerTests.cs"
      - "src/MapStudio.Renderer/Viewport/NativeSplineEndpointSnapFinder.cs"
      - "src/MapStudio.Core/Omsi/Maps/OmsiSplineLinkPlanner.cs"
      - "src/MapStudio.Core/Omsi/Maps/OmsiTileGrid.cs"
      - "src/MapStudio.Core/Omsi/Maps/OmsiTileContentCache.cs"
      - "src/MapStudio.Core/Omsi/Maps/OmsiTerrainBorderStitcher.cs"
      - "tests/MapStudio.Core.Tests/OmsiSplineTests.cs"
      - "tests/MapStudio.Core.Tests/OmsiTileGridTests.cs"
      - "tests/MapStudio.Core.Tests/OmsiTileContentCacheTests.cs"
      - "tests/MapStudio.Core.Tests/OmsiTerrainBorderStitcherTests.cs"
      - "tests/MapStudio.Core.Tests/OmsiTileCreationRoundTripTests.cs"
      - "tests/MapStudio.Renderer.Tests/NativeTileAdjacencyTests.cs"
      - "tests/MapStudio.Renderer.Tests/NativeSplineEndpointSnapFinderTests.cs"
      - "src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs"
      - "src/MapStudio.Renderer/Scene/NativeDerivedFileCache.cs"
      - "src/MapStudio.Renderer/Scene/NativeSceneryAssetLoader.cs"
      - "src/MapStudio.Renderer/Scene/NativeSplineAssetLoader.cs"
      - "src/MapStudio.Renderer/Scene/NativeSplineAsset.cs"
      - "tests/MapStudio.Renderer.Tests/NativeDerivedFileCacheTests.cs"
      - "src/MapStudio.Renderer/Scene/NativeSplinePlacementGeometryBuilder.cs"
      - "src/MapStudio.Renderer/Scene/NativeReferenceOverlayGeometryBuilder.cs"
      - "tests/MapStudio.Renderer.Tests/NativeReferenceOverlayGeometryBuilderTests.cs"
      - "src/MapStudio.Renderer/Scene/NativePickingProxyGeometryBuilder.cs"
      - "tools/build_user_manual_pdf.py"
      - "docs/pt-BR/USER_MANUAL.md"
      - "docs/en/USER_MANUAL.md"
      - "docs/pt-BR/releases/v0.2.0-alpha.5-test.10.27-native.md"
      - "docs/en/releases/v0.2.0-alpha.5-test.10.27-native.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-preview-release
  cancel-in-progress: true

env:
  VERSION: 0.2.0-alpha.5-test.10.27-native
  TAG: v0.2.0-alpha.5-test.10.27-native

jobs:
  build-native-preview:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python for PDF manual
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF manual dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Verify WinUI theme resources
        shell: pwsh
        run: |
          $appXaml = Get-Content src/MapStudio.Native/App.xaml -Raw
          if ($appXaml -notmatch "XamlControlsResources") {
            throw "App.xaml does not load XamlControlsResources. WinUI control theme resources would fail at startup."
          }

          $requiredThemeKeys = @(
            "MapStudioWindowBackgroundBrush",
            "MapStudioSurfaceBrush",
            "MapStudioSurfaceAltBrush",
            "MapStudioSurfaceRaisedBrush",
            "MapStudioBorderBrush",
            "MapStudioBorderStrongBrush",
            "MapStudioTextPrimaryBrush",
            "MapStudioTextSecondaryBrush",
            "MapStudioTextMutedBrush",
            "MapStudioAccentBrush",
            "MapStudioAccentSurfaceBrush",
            "MapStudioAccentTextBrush",
            "MapStudioSuccessBrush",
            "MapStudioTranslucentSurfaceBrush",
            "MapStudioTranslucentRaisedBrush",
            "MapStudioPanelBackgroundBrush"
          )

          foreach ($key in $requiredThemeKeys) {
            if ($appXaml -notmatch ('x:Key="' + [regex]::Escape($key) + '"')) {
              throw "App.xaml is missing global theme resource '$key'. MainWindow/Timetable can fail during startup."
            }
          }

          Write-Host "Verified XamlControlsResources and required global Map Studio theme resources in App.xaml."

      - name: Verify Map project mode wiring
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $code = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw

          if ($xaml -notmatch 'x:Name="MapExplorerModeButton"') {
            throw "Project panel is missing MapExplorerModeButton."
          }

          if ($xaml -notmatch 'Click="OnMapExplorerModeClick"') {
            throw "MapExplorerModeButton must open the inline Map project mode."
          }

          if ($xaml -match 'x:Name="GlobalTilesButton"') {
            throw "Tiles must stay in Project; GlobalTilesButton must not be restored."
          }

          if ($xaml -match 'Click="OnTileManagerClick"') {
            throw "No Map/Tiles entry point may call the legacy ContentDialog tile manager."
          }

          $mapHandler = [regex]::Match(
            $code,
            'private void OnMapExplorerModeClick[\s\S]*?private void RefreshMapExplorer'
          ).Value

          if ($mapHandler -match 'Viewport\.RestoreSceneView') {
            throw "Switching to Project > Map must not mutate or restore the viewport."
          }

          if ($code -notmatch 'RefreshMapExplorerAsync[\s\S]{0,12000}Task\.Run') {
            throw "Map tile aggregation must stay off the UI thread."
          }

          if ($xaml -notmatch 'x:Name="MapExplorerPanel"') {
            throw "Inline MapExplorerPanel is missing."
          }

          if ($code -notmatch 'private void OnMapExplorerModeClick') {
            throw "OnMapExplorerModeClick handler is missing."
          }

          Write-Host "Verified inline Map/Tiles project mode and global tile navigation wiring."

      - name: Verify adaptive dialog reparent safety
        shell: pwsh
        run: |
          $helper = Get-Content src/MapStudio.Native/Dialogs/AdaptiveContentDialogExtensions.cs -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw

          if ($helper -notmatch 'dialog\.Content\s*=\s*null;[\s\S]{0,1600}scroll\.Content\s*=\s*content;') {
            throw "Adaptive ContentDialog must detach FrameworkElement content before re-parenting it into ScrollViewer."
          }

          if ($main -notmatch 'OnOpenMapCatalogClick[\s\S]{0,12000}Open map catalog failure type=') {
            throw "Map catalog handler must catch and log dialog/runtime failures instead of terminating the app."
          }

          Write-Host "Verified ContentDialog detach/re-parent order and map catalog exception guard."

      - name: Verify Project resize and HUMAN paths
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $options = Get-Content src/MapStudio.Renderer/Scene/NativeTrafficPathDisplayOptions.cs -Raw
          $geometry = Get-Content src/MapStudio.Renderer/Scene/NativeTrafficPathGeometryBuilder.cs -Raw
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw

          if (-not $xaml.Contains('x:Name="ExplorerResizeGrip"')) {
            throw "Project panel resize grip is missing."
          }

          if (-not $xaml.Contains('PointerMoved="OnExplorerResizeGripMoved"')) {
            throw "Project panel resize grip is not wired."
          }

          if (-not $main.Contains('private void OnExplorerResizeGripMoved')) {
            throw "Project panel resize handler is missing."
          }

          if (-not $xaml.Contains('MaxHeight="340"') -or -not $xaml.Contains('VerticalScrollMode="Auto"')) {
            throw "Asset Library filter area must keep internal vertical scrolling."
          }

          if (-not $options.Contains('TransportOverview') -or -not $options.Contains('Pedestrians: true')) {
            throw "TransportOverview / pedestrian path support is missing."
          }

          if (-not $runtime.Contains('TransportOverview')) {
            throw "Viewport runtime must default to the transport overview."
          }

          $overviewUses = ([regex]::Matches($main, [regex]::Escape('.TransportOverview'))).Count
          if ($overviewUses -lt 2) {
            throw "Traffic and Transport tools must both use the overview that includes HUMAN paths."
          }

          if (-not $geometry.Contains('new(1.0f, 0.82f, 0.08f, 1.0f)')) {
            throw "HUMAN path high-contrast color is missing."
          }

          Write-Host "Verified resizable Project panel, library scroll and HUMAN path visibility."

      - name: Verify city-builder road elevation and bundled manuals
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $viewport = Get-Content src/MapStudio.Native/Controls/NativeViewport.xaml.cs -Raw
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw
          $math = Get-Content src/MapStudio.Renderer/Viewport/NativeSplinePlacementMath.cs -Raw

          foreach ($control in @(
            'Content="↓ Baixar"',
            'Content="Nivelar"',
            'Content="↑ Elevar"',
            'x:Name="RoadElevationStepBox"',
            'x:Name="RoadMaxGradientBox"'
          )) {
            if (-not $xaml.Contains($control)) {
              throw "Road elevation UI is missing: $control"
            }
          }

          if (-not $math.Contains('ResolveRoadEndpointHeight')) {
            throw "Real road endpoint elevation resolver is missing."
          }

          foreach ($mode in @(
            'NativeRoadElevationMode.Elevate',
            'NativeRoadElevationMode.Level',
            'NativeRoadElevationMode.Lower',
            'NativeRoadElevationMode.FollowTerrain'
          )) {
            if (-not ($main.Contains($mode) -or $runtime.Contains($mode) -or $math.Contains($mode))) {
              throw "Road elevation mode is missing: $mode"
            }
          }

          foreach ($action in @(
            'NativeSelectionContextAction.Elevate',
            'NativeSelectionContextAction.Level',
            'NativeSelectionContextAction.Lower',
            'NativeSelectionContextAction.Replace',
            'NativeSelectionContextAction.Mirror',
            'NativeSelectionContextAction.Flow'
          )) {
            if (-not $viewport.Contains($action)) {
              throw "Spline radial wheel action is missing: $action"
            }
          }

          if (-not $xaml.Contains('Text="Manual do Usuário (Português)"')) {
            throw "Help menu does not expose the Portuguese user manual."
          }

          if (-not $xaml.Contains('Text="User Manual (English)"')) {
            throw "Help menu does not expose the English user manual."
          }

          if (-not $main.Contains('OpenUserManual')) {
            throw "Bundled manual launcher is missing."
          }

          if (-not (Test-Path docs/pt-BR/USER_MANUAL.md)) {
            throw "Portuguese user manual is missing."
          }

          if (-not (Test-Path docs/en/USER_MANUAL.md)) {
            throw "English user manual is missing."
          }

          if (-not $viewport.Contains('_isSplineDragCreating')) {
            throw "Spline drag creation state is missing."
          }

          if (-not $viewport.Contains('TryConfirmEasyRoad')) {
            throw "Drag release does not finalize Easy Road."
          }

          if (-not $runtime.Contains('CollectSelectablePickCandidates')) {
            throw "Easy overlapping selection candidate collector is missing."
          }

          if (-not $xaml.Contains('x:Name="AiStatusButton"')) {
            throw "Map AI connection button is missing."
          }

          if (-not $main.Contains('OnConnectAiToMapClick')) {
            throw "Map AI connection handler is missing."
          }

          if (-not (Test-Path tools/build_user_manual_pdf.py)) {
            throw "PDF manual generator is missing."
          }

          Write-Host "Verified road elevation, drag spline finalization, easy selection, map AI connection and manuals."

      - name: Verify direct viewport manipulation and tool icons
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $viewport = Get-Content src/MapStudio.Native/Controls/NativeViewport.xaml.cs -Raw
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw

          if (-not $runtime.Contains('TryBeginDirectMove')) {
            throw "Direct selected-item move is missing from the viewport runtime."
          }

          if (-not $viewport.Contains('TryBeginDirectMove')) {
            throw "NativeViewport does not start direct selected-item move."
          }

          if (-not $runtime.Contains('NativeGizmoHandle.MoveXZ')) {
            throw "Free planar direct move handle is missing."
          }

          if (-not $runtime.Contains('TryBeginDirectRotation')) {
            throw "Direct selected-item rotation is missing from the viewport runtime."
          }

          if (-not $viewport.Contains('TryBeginDirectRotation')) {
            throw "NativeViewport does not start direct selected-item rotation."
          }

          if (-not $main.Contains('arraste o próprio item selecionado')) {
            throw "Rotate tool does not explain direct viewport interaction."
          }

          foreach ($symbol in @(
            'Symbol="Save"',
            'Symbol="Undo"',
            'Symbol="Redo"',
            'Symbol="FullScreen"',
            'Symbol="Rotate"',
            'Symbol="Target"',
            'Symbol="Copy"',
            'Symbol="Cut"'
          )) {
            if (-not $xaml.Contains($symbol)) {
              throw "Expected tool icon is missing: $symbol"
            }
          }

          if ($xaml.Contains('Content="F11"')) {
            throw "Loose textual F11 toolbar button must not return."
          }

          if ($xaml.Contains('ToolTipService.ToolTip="Arraste para mover no F11"')) {
            throw "Floating-panel pointer tooltip still contains F11."
          }

          if ($xaml.Contains('Use o Inspector e a Biblioteca para configurar esta ferramenta.')) {
            throw "Primary tool guidance must not require Inspector."
          }

          if (-not (Test-Path docs/pt-BR/USER_MANUAL.md) -or
              -not (Get-Content docs/pt-BR/USER_MANUAL.md -Raw).Contains('Nenhuma função principal depende do Inspector')) {
            throw "Portuguese manual must document Inspector as optional."
          }

          if (-not (Test-Path docs/en/USER_MANUAL.md) -or
              -not (Get-Content docs/en/USER_MANUAL.md -Raw).Contains('No primary editor function depends on the Inspector')) {
            throw "English manual must document Inspector as optional."
          }

          Write-Host "Verified direct rotation, optional Inspector rule, tool icons and F11 pointer-label cleanup."

      - name: Verify test 10.10 editor workflows
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw
          $renderer = Get-Content src/MapStudio.Renderer/Graphics/D3D11NativeMapRenderer.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw
          $planner = Get-Content src/MapStudio.Core/Omsi/Maps/OmsiSplineLinkPlanner.cs -Raw

          foreach ($required in @(
            'x:Name="AiProfileSelectorBox"',
            'Click="OnRoadAutoConnectClick"',
            'x:Name="MapReferenceAttributionBorder"',
            'Click="OnMapReferenceClick"'
          )) {
            if (-not $xaml.Contains($required)) {
              throw "Test 10.10 UI wiring is missing: $required"
            }
          }

          if (-not $main.Contains('OnAiProfileSelectorChanged')) {
            throw "AI profile selector handler is missing."
          }

          if (-not $main.Contains('OnRoadAutoConnectClick')) {
            throw "Road Auto connect handler is missing."
          }

          if (-not $runtime.Contains('TryGetAutoConnectLinksForSelectedSpline')) {
            throw "Selected spline auto-connect detection is missing."
          }

          if (-not $renderer.Contains('_selectionGhostBuffer') -or
              -not $renderer.Contains('RebuildSelectionGhost')) {
            throw "Filled selection ghost preview is missing."
          }

          if (-not $session.Contains('LoadCartoReferenceAsync') -or
              -not $session.Contains('basemaps.cartocdn.com/rastertiles/light_all') -or
              -not $session.Contains('?key=')) {
            throw "Keyed CARTO/OpenStreetMap reference provider is missing."
          }

          if (-not $session.Contains('TimeSpan.FromDays') -or
              -not $session.Contains('OMSI-Map-Studio/0.2')) {
            throw "OpenStreetMap cache/User-Agent safeguards are missing."
          }

          if (-not $session.Contains('repairBrokenLinks') -or
              -not $main.Contains('repairBrokenLinks:')) {
            throw "Auto connect broken-link repair mode is missing."
          }

          if (-not $xaml.Contains('x:Name="MapText"') -or
              -not $xaml.Contains('Visibility="Collapsed"')) {
            throw "Project map summary must remain visually removed."
          }

          Write-Host "Verified selection ghost, AI selector, map providers, Project cleanup and spline Auto connect."

      - name: Verify test 10.16 UX and real-map area tools
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $viewport = Get-Content src/MapStudio.Native/Controls/NativeViewport.xaml.cs -Raw
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw
          $renderer = Get-Content src/MapStudio.Renderer/Graphics/D3D11NativeMapRenderer.cs -Raw

          foreach ($required in @(
            'x:Name="TileNavigatorWindow"',
            'x:Name="RealMapAreaWindow"',
            'x:Name="RealMapAreaWebView"',
            'x:Name="CreateRealMapAreaButton"',
            'x:Name="ProjectSummaryCard"',
            'x:Name="MapExplorerCollapseButton"'
          )) {
            if (-not $xaml.Contains($required)) {
              throw "Test 10.16 UI wiring is missing: $required"
            }
          }

          foreach ($required in @(
            'BeginPointerPan',
            'UpdatePointerPan',
            'TryGetPointerPlanePoint',
            '_selectedPickingIds',
            'GetSelectedSelectionInfos'
          )) {
            if (-not $runtime.Contains($required)) {
              throw "Test 10.16 viewport runtime feature is missing: $required"
            }
          }

          if (-not $renderer.Contains('SetAdditionalSelections')) {
            throw "Multiple selection highlighting is missing."
          }

          foreach ($required in @(
            'additiveSelection',
            'GetRadialActionGlyph',
            'Ctrl+clique adiciona/remove'
          )) {
            if (-not $viewport.Contains($required)) {
              throw "Multi-selection/radial UI feature is missing: $required"
            }
          }

          foreach ($required in @(
            'OnCreateRealMapAreaClick',
            'BuildRealMapAreaPickerHtml',
            'PrepareOsmRoadsForRealMapAreaAsync',
            'overpass-api.de/api/interpreter',
            'OnToggleTileNavigatorWindowClick',
            'OnTileNavigatorResizeMoved',
            'DeleteCurrentSelectionAsync'
          )) {
            if (-not $main.Contains($required)) {
              throw "Test 10.16 MainWindow workflow is missing: $required"
            }
          }

          if (-not $main.Contains('OpenStreetMap contributors')) {
            throw "Real-map picker must keep OpenStreetMap attribution."
          }

          if (-not $main.Contains('Maps JavaScript API') -and
              -not $main.Contains('maps.googleapis.com/maps/api/js')) {
            throw "Google area selector integration is missing."
          }

          Write-Host "Verified Test 10.16 natural movement, multi-selection, radial icons, floating windows and real-map area creation."

      - name: Verify test 10.16 tile-grid persistence and terrain continuity
        shell: pwsh
        run: |
          $grid = Get-Content src/MapStudio.Core/Omsi/Maps/OmsiTileGrid.cs -Raw
          $stitcher = Get-Content src/MapStudio.Core/Omsi/Maps/OmsiTerrainBorderStitcher.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $roundTrip = Get-Content tests/MapStudio.Core.Tests/OmsiTileCreationRoundTripTests.cs -Raw

          foreach ($required in @(
            'TileSize = 300.0',
            'GetCenteredAreaMinimumOffset',
            'GetCenteredAreaAnchorLocalCoordinate',
            'WorldToTileCoordinate'
          )) {
            if (-not $grid.Contains($required)) {
              throw "Canonical OMSI tile-grid feature is missing: $required"
            }
          }

          foreach ($required in @(
            'StitchToNeighbors',
            'negativeXNegativeY',
            'positiveXNegativeY',
            'negativeXPositiveY',
            'positiveXPositiveY'
          )) {
            if (-not $stitcher.Contains($required)) {
              throw "Terrain edge/corner stitching feature is missing: $required"
            }
          }

          if (-not $session.Contains('StitchCreatedTileTerrainAsync')) {
            throw "Created tiles are not routed through terrain stitching."
          }

          if (-not $main.Contains('GetCenteredAreaAnchorLocalCoordinate')) {
            throw "Real-map area centering is not using the canonical OMSI grid."
          }

          if (-not $roundTrip.Contains('PersistedThreeByThreeGridReopensWithContinuousTerrainEdges')) {
            throw "Persisted 3x3 tile round-trip regression test is missing."
          }

          Write-Host "Verified Test 10.16 canonical 300 m grid, diagonal terrain corner continuity and persisted 3x3 round-trip coverage."

      - name: Verify test 10.16 smooth navigation path
        shell: pwsh
        run: |
          $runtime = Get-Content src/MapStudio.Renderer/Viewport/NativeViewportRuntime.cs -Raw
          $renderer = Get-Content src/MapStudio.Renderer/Graphics/D3D11NativeMapRenderer.cs -Raw
          $viewport = Get-Content src/MapStudio.Native/Controls/NativeViewport.xaml.cs -Raw
          $tests = Get-Content tests/MapStudio.Renderer.Tests/NativeViewportNavigationTests.cs -Raw

          foreach ($required in @(
            '_panGrabStartPixelX',
            '_panGrabStartPixelY',
            'Navigation.RestoreState',
            'Navigation.PanPixels',
            'refreshPicking:',
            'updateGizmoGeometry:'
          )) {
            if (-not $runtime.Contains($required)) {
              throw "Smooth navigation runtime feature is missing: $required"
            }
          }

          if (-not $runtime.Contains('RefreshPicking()')) {
            throw "Navigation must refresh picking after the gesture finishes."
          }

          if (-not $renderer.Contains('bool refreshPicking = true')) {
            throw "Renderer must allow visible-only navigation frames."
          }

          if (-not $renderer.Contains('public void RefreshPicking')) {
            throw "Renderer picking refresh entry point is missing."
          }

          if (-not $viewport.Contains('_isPanning &&') -or
              -not $viewport.Contains('_isOrbiting)')) {
            throw "Pointer coordinate text suppression during pan/orbit is missing."
          }

          if (-not $tests.Contains('AbsolutePanFromCapturedStateDoesNotAccumulatePointerEvents')) {
            throw "Absolute pan stability regression test is missing."
          }

          if (-not $tests.Contains('PanKeepsGrabDirectionNatural')) {
            throw "Natural grab direction regression test is missing."
          }

          Write-Host "Verified Test 10.16 stable absolute pan, navigation-only rendering and deferred picking refresh."

      - name: Verify test 10.16 frame-coalesced navigation
        shell: pwsh
        run: |
          $viewport = Get-Content src/MapStudio.Native/Controls/NativeViewport.xaml.cs -Raw

          foreach ($required in @(
            'CompositionTarget.Rendering',
            'QueuePanFrame',
            'QueueOrbitFrame',
            'FlushPendingNavigationFrame',
            'StopNavigationRendering',
            '_navigationFramePending',
            '_pendingOrbitDeltaX',
            '_pendingOrbitDeltaY'
          )) {
            if (-not $viewport.Contains($required)) {
              throw "Frame-coalesced navigation feature is missing: $required"
            }
          }

          if (-not $viewport.Contains('FlushPendingNavigationFrame();')) {
            throw "Pending navigation frame must be flushed when the gesture ends."
          }

          if (-not $viewport.Contains('CompositionTarget.Rendering -=')) {
            throw "Navigation rendering hook must be removed when the gesture ends."
          }

          Write-Host "Verified Test 10.16 one-navigation-update-per-compositor-frame path."

      - name: Verify test 10.16 compact UI, map tiles, AI key and asset flow
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw

          if (-not $main.Contains('https://tile.openstreetmap.org/{z}/{x}/{y}.png')) {
            throw "OpenStreetMap interactive fallback is missing when no CARTO key is saved."
          }

          if (-not $main.Contains('basemaps.cartocdn.com/rastertiles/light_all') -or
              -not $main.Contains('?key={cartoKey}')) {
            throw "Embedded keyed CARTO/OSM basemap is missing."
          }

          if (-not $session.Contains('basemaps.cartocdn.com/rastertiles/light_all') -or
              -not $session.Contains('?key=')) {
            throw "Terrain map-reference keyed CARTO/OSM source is missing."
          }

          foreach ($required in @(
            'FloatingAiCredentialBox',
            'SaveActiveAiCredentialButton',
            'OnSaveActiveAiCredentialClick',
            'OnClearActiveAiCredentialClick'
          )) {
            if (-not $xaml.Contains($required) -and -not $main.Contains($required)) {
              throw "Direct AI credential flow is missing: $required"
            }
          }

          foreach ($required in @(
            'RealMapOpenLibraryAfterCreateCheckBox',
            'OnOpenAssetLibraryFromRealMapClick',
            '+ Pasta de itens',
            'Abrir Biblioteca'
          )) {
            if (-not $xaml.Contains($required) -and -not $main.Contains($required)) {
              throw "Real-map asset flow is missing: $required"
            }
          }

          foreach ($required in @(
            'Value="64"',
            'Value="54"',
            'Width="560"',
            'Height="600"',
            'Width="800"',
            'Width="300"',
            'Width="290"'
          )) {
            if (-not $xaml.Contains($required)) {
              throw "Compact editor layout marker is missing: $required"
            }
          }

          Write-Host "Verified Test 10.16 compact UI, embedded basemap, direct AI credential and asset insertion flow."

      - name: Verify test 10.27 progressive region navigation
        shell: pwsh
        run: |
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw

          foreach ($required in @(
            'LoadPerformanceRegionProgressivelyAsync',
            'targetAlreadyLoaded',
            'focusedExistingTarget',
            'PendingTransformCount',
            'radius: 0',
            'radius: 1',
            'focusActiveTile: false',
            'Tile alvo pronto'
          )) {
            if (-not $main.Contains($required)) {
              throw "Test 10.27 progressive navigation wiring is missing: $required"
            }
          }

          $progressive = [regex]::Match(
            $main,
            'private async Task<NativeMapSnapshot>[\s\S]*?LoadPerformanceRegionProgressivelyAsync[\s\S]*?return region;'
          ).Value

          if (-not $progressive.Contains('_session.SetActiveTile') -or
              -not $progressive.Contains('Viewport.FocusTile')) {
            throw "Loaded target tiles must focus immediately before the surrounding 3×3 refresh."
          }

          Write-Host "Verified visible-first tile focus and progressive 3×3 completion."

      - name: Verify test 10.27 CARTO key integration
        shell: pwsh
        run: |
          $xaml = Get-Content src/MapStudio.Native/MainWindow.xaml -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $credentials = Get-Content src/MapStudio.Native/Services/NativeMapCredentialStore.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw

          foreach ($required in @(
            'x:Name="RealMapCartoKeyBox"',
            'x:Name="SaveRealMapCartoKeyButton"',
            'Click="OnSaveRealMapCartoKeyClick"',
            'Click="OnOpenCartoKeyHelpClick"'
          )) {
            if (-not $xaml.Contains($required)) {
              throw "Test 10.27 CARTO credential UI is missing: $required"
            }
          }

          foreach ($required in @(
            'TryGetCartoBasemapsApiKey',
            'SaveCartoBasemapsApiKey',
            'CartoBasemapsAccount'
          )) {
            if (-not $credentials.Contains($required)) {
              throw "Test 10.27 CARTO credential storage is missing: $required"
            }
          }

          if (-not $main.Contains('carto.com/basemaps/apikey/')) {
            throw "CARTO key help URL is missing from the UI."
          }

          if (-not $main.Contains('tile.openstreetmap.org/{z}/{x}/{y}.png')) {
            throw "OSM interactive fallback is missing when the CARTO key is absent."
          }

          if (-not $session.Contains('LoadCartoReferenceAsync') -or
              -not $session.Contains('/rastertiles/light_all/') -or
              -not $session.Contains('?key=')) {
            throw "Keyed CARTO reference loading is missing."
          }

          if ($session.Contains('"carto-osm"')) {
            throw "Old unkeyed CARTO cache namespace must not be reused."
          }

          Write-Host "Verified CARTO Basemaps API key UI, secure storage, keyed URLs and OSM picker fallback."

      - name: Verify test 10.27 CARTO ground-reference decode fix
        shell: pwsh
        run: |
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw
          $loader = Get-Content src/MapStudio.Renderer/Graphics/NativeGpuTextureLoader.cs -Raw
          $png = Get-Content src/MapStudio.Renderer/Graphics/NativePngDecoder.cs -Raw
          $tests = Get-Content tests/MapStudio.Renderer.Tests/NativePngDecoderTests.cs -Raw

          foreach ($required in @(
            'HasPngSignature',
            'cartoReferenceInvalidPngPayload'
          )) {
            if (-not $session.Contains($required)) {
              throw "Test 10.27 CARTO download validation is missing: $required"
            }
          }

          if ($session.Contains('EnsureReferenceTgaAsync') -or
              $session.Contains('BitmapDecoder') -or
              $session.Contains('BitmapPixelFormat.Bgra8')) {
            throw "CARTO ground reference must not depend on WinRT PNG-to-TGA conversion."
          }

          foreach ($required in @(
            'NativePngDecoder',
            'TryDecodeFile',
            'CreateRgbaTexture'
          )) {
            if (-not $loader.Contains($required) -and -not $png.Contains($required)) {
              throw "Test 10.27 direct PNG renderer path is missing: $required"
            }
          }

          if (-not $tests.Contains('DecodesNonInterlacedRgbaPngWithoutWic') -or
              -not $tests.Contains('RejectsNonPngPayload')) {
            throw "Test 10.27 PNG decoder regression coverage is missing."
          }

          if (-not $main.Contains('failureStage') -or
              -not $main.Contains('download/conversão da referência CARTO') -or
              -not $main.Contains('envio da textura para o viewport') -or
              -not $main.Contains('carto-reference.log')) {
            throw "Test 10.27 staged map-reference diagnostics are missing."
          }

          Write-Host "Verified CARTO PNG validation, direct native PNG decoding and staged viewport diagnostics."

      - name: Verify CARTO mosaic and georeference hardening
        shell: pwsh
        run: |
          $session = Get-Content src/MapStudio.Native/Services/OmsiNativeSession.cs -Raw
          $main = Get-Content src/MapStudio.Native/MainWindow.xaml.cs -Raw
          $renderer = Get-Content src/MapStudio.Renderer/Graphics/D3D11NativeMapRenderer.cs -Raw
          $overlayBuilder = Get-Content src/MapStudio.Renderer/Scene/NativeReferenceOverlayGeometryBuilder.cs -Raw
          $overlayTests = Get-Content tests/MapStudio.Renderer.Tests/NativeReferenceOverlayGeometryBuilderTests.cs -Raw
          $loader = Get-Content src/MapStudio.Renderer/Graphics/NativeGpuTextureLoader.cs -Raw

          foreach ($required in @(
            'JsonSerializerDefaults.Web',
            'PropertyNameCaseInsensitive',
            'georeference.MapType',
            'carto-keyed-v4',
            'rastertiles/voyager',
            'mosaic-coverage',
            'mosaic-download',
            'maximumResidentTiles',
            'SemaphoreSlim',
            'cartoReferenceInvalidPngPayload:',
            'TryWriteCartoReferenceDiagnostic',
            'carto-reference.log',
            'cartoReferenceNull:'
          )) {
            if (-not $session.Contains($required)) {
              throw "CARTO mosaic/georeference hardening marker is missing: $required"
            }
          }

          foreach ($required in @(
            'SetReferenceOverlays',
            'BuildReferenceOverlayDefinitions',
            'RefreshActiveReferenceOverlayAsync',
            'reference.TileCount',
            '_activeCartoBasemapsApiKey'
          )) {
            if (-not $main.Contains($required)) {
              throw "CARTO streamed overlay marker is missing: $required"
            }
          }

          foreach ($required in @(
            '_referenceOverlayBatches',
            'SetReferenceOverlays',
            '_maskSampler'
          )) {
            if (-not $renderer.Contains($required)) {
              throw "CARTO tiled renderer marker is missing: $required"
            }
          }

          foreach ($required in @(
            'scene.Tiles',
            'minimumOverlayX',
            'GetHeightAtLocalPoint',
            'minimumTileX',
            'maximumTileX'
          )) {
            if (-not $overlayBuilder.Contains($required)) {
              throw "Terrain-clipped reference overlay marker is missing: $required"
            }
          }

          if (-not $overlayTests.Contains('BuildClipsOverlayToLoadedTerrain') -or
              -not $overlayTests.Contains('BuildSkipsReferenceOutsideLoadedTerrain')) {
            throw "Terrain-clipped reference overlay regression coverage is missing."
          }

          if (-not $session.Contains('value.MapType.Trim()') -or
              -not $session.Contains('string.IsNullOrWhiteSpace(')) {
            throw "ValidateGeoreference null guard is missing."
          }

          foreach ($required in @(
            'if (decoder is null)',
            'if (frame is null)',
            'if (converter is null)',
            'NullReferenceException'
          )) {
            if (-not $loader.Contains($required)) {
              throw "WIC null guard is missing: $required"
            }
          }

          Write-Host "Verified saved georeference loading, streamed CARTO mosaic, clamped sampling and WIC null safety."

      - name: Test OMSI core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release --arch x64

      - name: Test native renderer
        run: dotnet test tests/MapStudio.Renderer.Tests/MapStudio.Renderer.Tests.csproj --configuration Release --arch x64

      - name: Publish native WinUI x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish/win-x64 | Out-Null

          dotnet publish src/MapStudio.Native/MapStudio.Native.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:VERSION `
            -p:InformationalVersion="$env:VERSION+$env:GITHUB_SHA" `
            --output artifacts/publish/win-x64

          if (-not (Test-Path "artifacts/publish/win-x64/MapStudio.Native.exe")) {
            throw "MapStudio.Native.exe was not produced."
          }

          if (-not (Test-Path "artifacts/publish/win-x64/MapStudio.Native.pri")) {
            throw "MapStudio.Native.pri was not published. WinUI XAML resources would fail at startup."
          }

          Write-Host "Verified MapStudio.Native.pri is present in publish output."

          New-Item -ItemType Directory -Force -Path artifacts/publish/win-x64/Docs | Out-Null
          Copy-Item docs/pt-BR/USER_MANUAL.md artifacts/publish/win-x64/Docs/Manual-pt-BR.md -Force
          Copy-Item docs/en/USER_MANUAL.md artifacts/publish/win-x64/Docs/Manual-en.md -Force

          python tools/build_user_manual_pdf.py docs/pt-BR/USER_MANUAL.md artifacts/publish/win-x64/Docs/Manual-pt-BR.pdf --language pt-BR
          if ($LASTEXITCODE -ne 0) {
            throw "Portuguese PDF manual generation failed."
          }

          python tools/build_user_manual_pdf.py docs/en/USER_MANUAL.md artifacts/publish/win-x64/Docs/Manual-en.pdf --language en
          if ($LASTEXITCODE -ne 0) {
            throw "English PDF manual generation failed."
          }

          foreach ($manual in @(
            "artifacts/publish/win-x64/Docs/Manual-pt-BR.pdf",
            "artifacts/publish/win-x64/Docs/Manual-en.pdf"
          )) {
            if (-not (Test-Path $manual)) {
              throw "Bundled PDF manual is missing: $manual"
            }

            if ((Get-Item $manual).Length -lt 10000) {
              throw "Bundled PDF manual is unexpectedly small: $manual"
            }
          }

          $ptManualAsset = "artifacts/OMSI-Map-Studio-Manual-pt-BR-$env:VERSION.pdf"
          $enManualAsset = "artifacts/OMSI-Map-Studio-Manual-en-$env:VERSION.pdf"
          Copy-Item artifacts/publish/win-x64/Docs/Manual-pt-BR.pdf $ptManualAsset -Force
          Copy-Item artifacts/publish/win-x64/Docs/Manual-en.pdf $enManualAsset -Force

          Write-Host "Bundled PDF user manuals generated and copied to publish output."

      - name: Run native startup smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\win-x64\MapStudio.Native.exe"
          if (-not (Test-Path $exe)) {
            throw "Native executable is missing before startup smoke test."
          }

          $log = Join-Path $env:LOCALAPPDATA "OMSI Map Studio Native Preview\Logs\startup.log"
          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke-test" -PassThru

          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Native startup smoke test timed out after 45 seconds."
          }

          if ($process.ExitCode -ne 0) {
            throw "Native startup smoke test exited with code $($process.ExitCode)."
          }

          if (-not (Test-Path $log)) {
            throw "Native startup smoke test did not create startup.log."
          }

          $startupLog = Get-Content $log -Raw

          if (-not $startupLog.Contains("STARTUP_SMOKE_TEST_PASSED")) {
            Write-Host $startupLog
            throw "Native executable did not reach the successful startup marker."
          }

          if ($startupLog.Contains("FATAL stage=")) {
            Write-Host $startupLog
            throw "Native executable logged a fatal startup failure."
          }

          Write-Host "Native executable startup smoke test passed."

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/OMSI-Map-Studio-$env:VERSION-portable-win-x64.zip"
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build separate native preview installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 not found."
          }

          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\publish\win-x64" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" `
            "$env:GITHUB_WORKSPACE\installer\MapStudio.NativePreview.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = "artifacts/OMSI-Map-Studio-Native-Preview-Setup-$env:VERSION-win-x64.exe"
          if (-not (Test-Path $setup)) {
            throw "Native preview installer was not produced."
          }

          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" | Set-Content "$setup.sha256" -Encoding ascii

      - name: Prepare release notes
        shell: pwsh
        run: |
          Get-Content docs/pt-BR/releases/v0.2.0-alpha.5-test.10.27-native.md | Set-Content artifacts/release-notes.md -Encoding utf8
          Add-Content artifacts/release-notes.md ""
          Add-Content artifacts/release-notes.md "---"
          Add-Content artifacts/release-notes.md ""
          Get-Content docs/en/releases/v0.2.0-alpha.5-test.10.27-native.md | Add-Content artifacts/release-notes.md -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-${{ env.VERSION }}-win-x64
          path: |
            artifacts/OMSI-Map-Studio-${{ env.VERSION }}-portable-win-x64.zip
            artifacts/OMSI-Map-Studio-${{ env.VERSION }}-portable-win-x64.zip.sha256
            artifacts/OMSI-Map-Studio-Native-Preview-Setup-${{ env.VERSION }}-win-x64.exe
            artifacts/OMSI-Map-Studio-Native-Preview-Setup-${{ env.VERSION }}-win-x64.exe.sha256
            artifacts/OMSI-Map-Studio-Manual-pt-BR-${{ env.VERSION }}.pdf
            artifacts/OMSI-Map-Studio-Manual-en-${{ env.VERSION }}.pdf
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "artifacts/OMSI-Map-Studio-Native-Preview-Setup-$env:VERSION-win-x64.exe"
          $setupHash = "$setup.sha256"
          $zip = "artifacts/OMSI-Map-Studio-$env:VERSION-portable-win-x64.zip"
          $zipHash = "$zip.sha256"
          $ptManual = "artifacts/OMSI-Map-Studio-Manual-pt-BR-$env:VERSION.pdf"
          $enManual = "artifacts/OMSI-Map-Studio-Manual-en-$env:VERSION.pdf"

          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $setup $setupHash $zip $zipHash $ptManual $enManual --clobber
          }
          else {
            gh release create "$env:TAG" $setup $setupHash $zip $zipHash $ptManual $enManual `
              --target "$env:GITHUB_SHA" `
              --title "OMSI Map Studio $env:TAG — Native Feature Preview" `
              --notes-file artifacts/release-notes.md `
              --prerelease
          }
