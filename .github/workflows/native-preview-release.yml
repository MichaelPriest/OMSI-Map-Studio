      - "src/MapStudio.Core/Omsi/Junctions/MapStudioJunctionAssetGenerator.cs"
      - "src/MapStudio.Core/Omsi/Junctions/MapStudioJunctionGeometrySizing.cs"
      - "src/MapStudio.Core/Omsi/Buildings/MapStudioBuildingAssetGenerator.cs"
      - "src/MapStudio.Core/Omsi/Buildings/MapStudioFootprintBuildingAssetGenerator.cs"
      - "src/MapStudio.Core/Workspace/MapStudioWorkspaceBootstrapper.cs"
      - "tests/MapStudio.Core.Tests/MapStudioStarterPropGeneratorTests.cs"
      - "tests/MapStudio.Core.Tests/MapStudioStarterTrafficGeneratorTests.cs"
