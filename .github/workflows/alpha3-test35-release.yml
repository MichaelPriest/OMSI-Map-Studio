name: alpha3 test35 prerelease with EXE

on:
  push:
    branches:
      - publish/alpha3-test35

permissions:
  contents: write

concurrency:
  group: alpha3-test35-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 20d7975176959a82cace4e165da144fcbe690db9
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "20d7975176959a82cace4e165da144fcbe690db9"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows EXE installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "0.1.0-alpha.3-test.35" -SkipUiBuild

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.35-win-x64.zip"
          if (-not (Test-Path "$publishDir/OMSI Map Studio.exe")) { throw "Desktop EXE missing." }
          if (-not (Test-Path "$publishDir/ui/index.html")) { throw "React UI missing." }
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  OMSI-Map-Studio-v0.1.0-alpha.3-test.35-win-x64.zip" | Set-Content "$zipPath.sha256" -Encoding ascii

          $installerPath = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.35-win-x64.exe"
          $installerHashPath = "$installerPath.sha256"
          if (-not (Test-Path $installerPath)) { throw "Installer EXE missing: $installerPath" }
          if (-not (Test-Path $installerHashPath)) { throw "Installer checksum missing: $installerHashPath" }

          $notes = @"
          # OMSI Map Studio v0.1.0-alpha.3-test.35

          Build de teste / Test build

          Source HEAD: 20d7975176959a82cace4e165da144fcbe690db9

          PT-BR:
          - Corrige novamente o caminho de texturas de ruas: formatos browser-native usam data URI explícito com MIME real; DDS/TGA mantêm seus loaders.
          - Perfis SLI mantêm textura/UV reais e material não iluminado com a própria textura OMSI.
          - SCO [rendertype] é preservado; surface/on_surface/presurface recebem tratamento visual baseado no dado real, sem aumentar coordenadas/offsets arbitrários.
          - Diagnóstico de seleção mostra textura resolvida, dimensões, formato/RGB médio e rendertype.
          - Abrir mapa agora lista os mapas instalados para o usuário escolher.
          - Barra lateral recolhível.
          - Filtros Tudo/Objetos/Splines/Terreno e atalhos Alt+1..4.
          - Atalhos Alt+R/C/O/T/A/G/Y abrem criação real de rua, cruzamento, objeto, terreno, água, grama e árvore usando bibliotecas instaladas.
          - CI #400 passou antes desta publicação.

          EN:
          - Reworks the road texture path again: browser-native formats use explicit MIME data URIs; DDS/TGA keep dedicated loaders.
          - SLI profiles keep real texture/UV data and use the same OMSI texture on the unlit material.
          - SCO [rendertype] is preserved; surface/on_surface/presurface receive data-driven preview handling without increasing arbitrary coordinate offsets.
          - Selection diagnostics show resolved texture, dimensions, format/average RGB, and rendertype.
          - Open map now lists installed maps for explicit user choice.
          - Collapsible main sidebar.
          - All/Objects/Splines/Terrain filters and Alt+1..4 shortcuts.
          - Alt+R/C/O/T/A/G/Y shortcuts open real road, junction, object, terrain, water, grass, and tree workflows using installed libraries.
          - CI #400 passed before this publication.
          "@
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload EXE and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.35-windows
          path: |
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.35-win-x64.exe
            artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.35-win-x64.exe.sha256
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.35-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.35-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.35"
          $sourceHead = "20d7975176959a82cace4e165da144fcbe690db9"
          $installer = "artifacts/OMSI-Map-Studio-Setup-0.1.0-alpha.3-test.35-win-x64.exe"
          $installerSha = "$installer.sha256"
          $zip = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.35-win-x64.zip"
          $zipSha = "$zip.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }

          gh release create $tag $installer $installerSha $zip $zipSha --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
