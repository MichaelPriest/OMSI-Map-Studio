name: alpha3 test7 prerelease

on:
  push:
    branches:
      - publish/alpha3-test7

permissions:
  contents: write

concurrency:
  group: alpha3-test7-prerelease
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: 2c3339b370fb4d7d237e429e2e034c482454884c
          fetch-depth: 1

      - name: Verify exact source HEAD
        shell: pwsh
        run: |
          $expected = "2c3339b370fb4d7d237e429e2e034c482454884c"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected) { throw "Source HEAD mismatch." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Core
        run: dotnet test tests/MapStudio.Core.Tests/MapStudio.Core.Tests.csproj --configuration Release

      - name: Install UI dependencies
        working-directory: src/MapStudio.UI
        run: npm install --no-audit --no-fund

      - name: Build React UI
        working-directory: src/MapStudio.UI
        run: npm run build

      - name: Publish Windows x64 self-contained
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64"
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

          dotnet publish src/MapStudio.Desktop/MapStudio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDir -p:EnableWindowsTargeting=true -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=0.1.0-alpha.3-test.7 -p:InformationalVersion=0.1.0-alpha.3-test.7+2c3339b370fb4d7d237e429e2e034c482454884c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $publishDir "OMSI Map Studio.exe"
          $uiIndex = Join-Path $publishDir "ui/index.html"
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }
          if (-not (Test-Path $uiIndex)) { throw "React UI was not embedded in publish output: $uiIndex" }

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $publishDir = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip" | Set-Content "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip.sha256" -Encoding ascii
          $notes = @"
          # OMSI Map Studio v0.1.0-alpha.3-test.7

          Build de teste / Test build

          Source HEAD: 2c3339b370fb4d7d237e429e2e034c482454884c

          Esta prerelease valida máscaras DDS A8 de terreno com resolução, faixa alpha e cobertura reais; ignora máscaras vazias, otimiza máscaras 100% opacas e mantém a pintura numerada [groundtex], relevo real, O3D, tela cheia e navegação.

          This prerelease validates A8 DDS terrain masks with real resolution, alpha range and coverage; skips empty masks, optimizes fully opaque masks, and keeps numbered [groundtex] paint, real relief, O3D, fullscreen and navigation.
          "@
          Set-Content "artifacts/release-notes.md" $notes -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64
          path: |
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip
            artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.3-test.7"
          $sourceHead = "2c3339b370fb4d7d237e429e2e034c482454884c"
          $zipPath = "artifacts/OMSI-Map-Studio-v0.1.0-alpha.3-test.7-win-x64.zip"
          $shaPath = "$zipPath.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite." }
          gh release create $tag $zipPath $shaPath --target $sourceHead --title "OMSI Map Studio $tag" --notes-file "artifacts/release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
